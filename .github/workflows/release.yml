name: Build Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow

      - name: Generate icon
        run: python scripts/make_icon.py

      - name: Build exe
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name SecondClass --icon assets/app.ico --version-file version_info.txt app.py

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SecondClass.exe
          generate_release_notes: true
